name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm run audit:ci

      - name: Check types
        if: ${{ !cancelled() }}
        run: npm run check

      - name: Lint code & style
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run unit tests
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build site
        if: ${{ !cancelled() }}
        run: npm run build

      - name: Validate build artifacts
        if: ${{ !cancelled() }}
        run: npm run check:build

      - name: Build does not modify tracked files
        if: ${{ !cancelled() }}
        run: git diff --exit-code

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
